<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - Portal Informatika</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
    }
    header {
      background-color: #2c3e50;
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 20px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .btn-logout {
      background-color: #e74c3c;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .grid-layout { grid-template-columns: 1fr; }
    }
    .card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .card h3 {
      margin-bottom: 20px;
      color: #2c3e50;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover { background-color: #219150; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
    table th {
      background-color: #f8f9fa;
      color: #2c3e50;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background-color: #e1f5fe;
      color: #0288d1;
    }
    #statusMsgKurikulum, #statusMsgNilai {
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portal Guru Informatika</h1>
    <div class="user-info">
      <span>Selamat Datang, <b id="namaGuru">Guru</b></span>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </header>

  <div class="container">
    <div class="grid-layout">
      
      <!-- FORM 1: UNGGAH CP, TP, ATP, MODUL & MEDIA -->
      <div class="card">
        <h3>Input Perangkat & Media Pembelajaran</h3>
        <form id="formKurikulum">
          <div class="form-group">
            <label>Kategori Dokumen / Media</label>
            <select id="kategori" required>
              <option value="CP">Capaian Pembelajaran (CP)</option>
              <option value="TP">Tujuan Pembelajaran (TP)</option>
              <option value="ATP">Alur Tujuan Pembelajaran (ATP)</option>
              <option value="Prota">Program Tahunan (Prota)</option>
              <option value="Prosem">Program Semester (Prosem)</option>
              <option value="Modul Ajar">Modul Ajar</option>
              <option value="Media Interaktif">Media Pembelajaran Interaktif</option>
            </select>
          </div>
          <div class="form-group">
            <label>Judul / Nama Materi</label>
            <input type="text" id="judul" placeholder="Contoh: Modul Ajar Algoritma & Pemrograman" required>
          </div>
          <div class="form-group">
            <label>Kelas</label>
            <input type="text" id="kelas" placeholder="Contoh: X Informatika 1" required>
          </div>
          <div class="form-group">
            <label>Link Google Drive / URL Media</label>
            <input type="url" id="link_url" placeholder="https://drive.google.com/..." required>
          </div>
          <div class="form-group">
            <label>Keterangan Tambahan</label>
            <textarea id="keterangan" rows="2" placeholder="Catatan atau petunjuk singkat..."></textarea>
          </div>
          <button type="submit" class="btn-submit" id="btnSimpanKurikulum">Simpan Perangkat</button>
        </form>
        <div id="statusMsgKurikulum"></div>
      </div>

      <!-- FORM 2: INPUT NILAI SISWA -->
      <div class="card">
        <h3>Input Nilai Siswa</h3>
        <form id="formNilai">
          <div class="form-group">
            <label>ID User Siswa (sesuai Sheet Users)</label>
            <input type="text" id="id_user_siswa" placeholder="Contoh: USR-002" required>
          </div>
          <div class="form-group">
            <label>Mata Pelajaran / Elemen</label>
            <input type="text" id="mata_pelajaran" value="Informatika" required>
          </div>
          <div class="form-group">
            <label>Nilai Tugas (30%)</label>
            <input type="number" id="nilai_tugas" min="0" max="100" placeholder="0 - 100" required oninput="hitungNilaiAkhir()">
          </div>
          <div class="form-group">
            <label>Nilai UTS (30%)</label>
            <input type="number" id="nilai_uts" min="0" max="100" placeholder="0 - 100" required oninput="hitungNilaiAkhir()">
          </div>
          <div class="form-group">
            <label>Nilai UAS (40%)</label>
            <input type="number" id="nilai_uas" min="0" max="100" placeholder="0 - 100" required oninput="hitungNilaiAkhir()">
          </div>
          <div class="form-group">
            <label>Estimasi Nilai Akhir</label>
            <input type="number" id="nilai_akhir" readonly style="background-color: #e9ecef; font-weight: bold;">
          </div>
          <button type="submit" class="btn-submit" id="btnSimpanNilai">Simpan Nilai</button>
        </form>
        <div id="statusMsgNilai"></div>
      </div>

    </div>

    <!-- TABEL DOKUMEN & MEDIA TERIMPAN -->
    <div class="card">
      <h3>Daftar Perangkat Pembelajaran Terdaftar</h3>
      <table id="tabelKurikulum">
        <thead>
          <tr>
            <th>Kategori</th>
            <th>Judul</th>
            <th>Kelas</th>
            <th>Akses Link</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // =========================================================
    // TEMPELKAN URL DEPLOY WEB APP APPS SCRIPT ANDA DI SINI
    // =========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbx9uKr1IKL4br0N_LeNbTpAiv4fUBok1XEdQwOf56KvGoXtdkgyO7abJRRJvjmU628X6A/exec";

    // 1. CEK HAK AKSES USER (PROTEKSI HALAMAN)
    const userData = JSON.parse(sessionStorage.getItem("userLoggedIn"));
    if (!userData || (userData.role.toLowerCase() !== "guru" && userData.role.toLowerCase() !== "admin")) {
      alert("Akses ditolak! Anda harus login sebagai Guru.");
      window.location.href = "index.html";
    } else {
      document.getElementById("namaGuru").innerText = userData.nama_lengkap;
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    // 2. LOGIKA HITUNG NILAI AKHIR OTOMATIS
    function hitungNilaiAkhir() {
      const tugas = parseFloat(document.getElementById("nilai_tugas").value) || 0;
      const uts = parseFloat(document.getElementById("nilai_uts").value) || 0;
      const uas = parseFloat(document.getElementById("nilai_uas").value) || 0;

      // Rumus: Tugas 30% + UTS 30% + UAS 40%
      const akhir = Math.round((tugas * 0.3) + (uts * 0.3) + (uas * 0.4));
      document.getElementById("nilai_akhir").value = akhir;
    }

    // 3. SUBMIT FORM PERANGKAT KURIKULUM
    document.getElementById("formKurikulum").addEventListener("submit", async function(e) {
      e.preventDefault();
      const statusMsg = document.getElementById("statusMsgKurikulum");
      statusMsg.innerText = "Menyimpan data...";

      const payload = {
        action: "tambah_kurikulum",
        kategori: document.getElementById("kategori").value,
        judul: document.getElementById("judul").value,
        kelas: document.getElementById("kelas").value,
        link_url: document.getElementById("link_url").value,
        keterangan: document.getElementById("keterangan").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          statusMsg.style.color = "green";
          statusMsg.innerText = result.message;
          document.getElementById("formKurikulum").reset();
          loadDaftarKurikulum();
        } else {
          statusMsg.style.color = "red";
          statusMsg.innerText = result.message;
        }
      } catch (err) {
        statusMsg.style.color = "red";
        statusMsg.innerText = "Gagal terhubung ke server.";
      }
    });

    // 4. SUBMIT FORM INPUT NILAI
    document.getElementById("formNilai").addEventListener("submit", async function(e) {
      e.preventDefault();
      const statusMsg = document.getElementById("statusMsgNilai");
      statusMsg.innerText = "Menyimpan nilai...";

      const payload = {
        action: "tambah_nilai",
        id_user: document.getElementById("id_user_siswa").value.trim(),
        mata_pelajaran: document.getElementById("mata_pelajaran").value,
        nilai_tugas: document.getElementById("nilai_tugas").value,
        nilai_uts: document.getElementById("nilai_uts").value,
        nilai_uas: document.getElementById("nilai_uas").value,
        nilai_akhir: document.getElementById("nilai_akhir").value
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          statusMsg.style.color = "green";
          statusMsg.innerText = result.message;
          document.getElementById("formNilai").reset();
        } else {
          statusMsg.style.color = "red";
          statusMsg.innerText = result.message;
        }
      } catch (err) {
        statusMsg.style.color = "red";
        statusMsg.innerText = "Gagal terhubung ke server.";
      }
    });

    // 5. LOAD TABEL PERANGKAT KURIKULUM
    async function loadDaftarKurikulum() {
      const tbody = document.querySelector("#tabelKurikulum tbody");
      try {
        const res = await fetch(`${API_URL}?sheet=Kurikulum`);
        const result = await res.json();

        if (result.status === "success" && result.data.length > 0) {
          tbody.innerHTML = "";
          result.data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td><span class="badge">${item.kategori}</span></td>
              <td><b>${item.judul}</b><br><small>${item.keterangan || ''}</small></td>
              <td>${item.kelas}</td>
              <td><a href="${item.link_url}" target="_blank">Buka Link</a></td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Belum ada perangkat/media diunggah.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat data.</td></tr>`;
      }
    }

    // Jalankan pertama kali
    loadDaftarKurikulum();
  </script>
</body>
</html>
