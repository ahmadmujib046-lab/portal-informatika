<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Pembelajaran Informatika</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .login-header h2 {
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 5px;
    }
    .login-header p {
      color: #7f8c8d;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #3498db;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login:hover {
      background-color: #2980b9;
    }
    .btn-login:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    #alertMsg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .alert-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h2>Portal Informatika</h2>
      <p>Silakan masuk ke akun Anda</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username / NIP / NIS</label>
        <input type="text" id="username" placeholder="Masukkan username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
    </form>

    <div id="alertMsg"></div>
  </div>

  <script>
    // =========================================================
    // TEMPELKAN URL DEPLOY WEB APP APPS SCRIPT ANDA DI SINI
    // =========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbx9uKr1IKL4br0N_LeNbTpAiv4fUBok1XEdQwOf56KvGoXtdkgyO7abJRRJvjmU628X6A/exec";

    const loginForm = document.getElementById("loginForm");
    const btnLogin = document.getElementById("btnLogin");
    const alertMsg = document.getElementById("alertMsg");

    loginForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      // Cek apakah URL API sudah diganti
      if (API_URL === "GANTI_DENGAN_URL_WEB_APP_ANDA" || API_URL === "") {
        showAlert("Silakan masukkan API_URL Apps Script Anda terlebih dahulu pada file HTML!", "error");
        return;
      }

      // Ambil nilai input
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();

      // Set state UI saat loading
      setLoading(true);
      hideAlert();

      const payload = {
        action: "login",
        username: usernameInput,
        password: passwordInput
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showAlert("Login berhasil! Memuat halaman...", "success");

          // Simpan data user ke sessionStorage agar halaman berikutnya tahu siapa yang sedang login
          sessionStorage.setItem("userLoggedIn", JSON.stringify(result.user));

          // Arahkan ke dashboard sesuai role
          setTimeout(() => {
            const role = result.user.role.toLowerCase();
            if (role === "guru" || role === "admin") {
              window.location.href = "dashboard-guru.html";
            } else {
              window.location.href = "dashboard-siswa.html";
            }
          }, 1000);

        } else {
          showAlert(result.message || "Username atau password salah!", "error");
          setLoading(false);
        }

      } catch (error) {
        console.error("Error Login:", error);
        showAlert("Gagal terhubung ke server. Pastikan URL API sudah benar.", "error");
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      if (isLoading) {
        btnLogin.disabled = true;
        btnLogin.innerText = "Memeriksa Data...";
      } else {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";
      }
    }

    function showAlert(message, type) {
      alertMsg.style.display = "block";
      alertMsg.innerText = message;
      if (type === "error") {
        alertMsg.className = "alert-error";
      } else {
        alertMsg.className = "alert-success";
      }
    }

    function hideAlert() {
      alertMsg.style.display = "none";
    }
  </script>
</body>
</html>
